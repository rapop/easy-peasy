<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Lookup</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 3rem auto; padding: 0 1rem; }
    input, button { font-size: 1rem; padding: 0.5rem; }
    #result { margin-top: 1.5rem; font-size: 1.25rem; }
    .error { color: #c0392b; }
  </style>
</head>
<body>
  <h1>Weather Lookup</h1>
  <form id="form">
    <input id="city" type="text" placeholder="Enter a city name" autofocus>
    <button type="submit">Get temperature</button>
  </form>
  <div id="result"></div>

  <script>
    const form = document.getElementById("form");
    const result = document.getElementById("result");

    async function getWeather(city) {
      // 1. Geocode the city name into latitude/longitude
      const geoUrl = "https://geocoding-api.open-meteo.com/v1/search?count=1&name=" + encodeURIComponent(city);
      const geoResp = await fetch(geoUrl);
      const geoData = await geoResp.json();

      if (!geoData.results || geoData.results.length === 0) {
        throw new Error("City not found: " + city);
      }

      const place = geoData.results[0];
      const lat = place.latitude;
      const lon = place.longitude;

      // 2. Fetch current weather for those coordinates
      const weatherUrl =
        "https://api.open-meteo.com/v1/forecast?current_weather=true&latitude=" + lat + "&longitude=" + lon;
      const weatherResp = await fetch(weatherUrl);
      const weatherData = await weatherResp.json();

      // 3. Pull the temperature out of the response
      const temp = weatherData.current_weather.temperature;

      return { name: place.name, country: place.country, temperature: temp };
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const city = document.getElementById("city").value.trim();
      if (!city) return;

      result.textContent = "Loading...";
      result.classList.remove("error");

      try {
        const info = await getWeather(city);
        // 4. Show the temperature (in °C) for the resolved place
        result.textContent = `${info.name}, ${info.country}: ${info.temperature} °C`;
      } catch (err) {
        result.classList.add("error");
        result.textContent = err.message;
      }
    });
  </script>
</body>
</html>
